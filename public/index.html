<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<title>对路 · 天赋测评</title>
<style>
:root {
  --paper: #f6f1e7;
  --paper-deep: #eee5d6;
  --ink: #1e1c18;
  --muted: #7c7365;
  --line: #ded4c3;
  --cream: #fffdf8;
  --accent: #b85c38;
  --soft: #f3e2d6;
  --serif: "Songti SC", "Noto Serif SC", "SimSun", "STSong", serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --shadow: 0 18px 50px rgba(60, 45, 30, 0.1);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--sans);
  background:
    radial-gradient(circle at 8% 4%, rgba(184, 92, 56, 0.1), transparent 32%),
    radial-gradient(circle at 92% 88%, rgba(62, 92, 75, 0.09), transparent 34%),
    var(--paper);
  -webkit-font-smoothing: antialiased;
}

button {
  font-family: inherit;
  color: inherit;
  cursor: pointer;
}

[hidden] {
  display: none !important;
}

.wrap {
  width: min(100% - 40px, 980px);
  margin: 0 auto;
}

/* ---------- home ---------- */

.home {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 0 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--ink);
  position: relative;
  display: inline-block;
}

.brand-mark::after {
  content: "";
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  right: 3px;
  top: 3px;
}

.brand-tag {
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--muted);
}

.hero {
  padding: 74px 0 46px;
}

.eyebrow {
  margin: 0 0 18px;
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--muted);
}

.hero h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(42px, 7vw, 76px);
  line-height: 1.12;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.hero h1 em {
  font-style: normal;
  color: var(--accent);
}

.hero-sub {
  margin: 26px 0 0;
  max-width: 520px;
  font-size: 15px;
  line-height: 1.9;
  color: var(--muted);
}

.hero-rule {
  width: 64px;
  height: 2px;
  background: var(--ink);
  margin-top: 34px;
}

.test-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  padding-bottom: 26px;
}

.test-card {
  --accent: #b85c38;
  --soft: #f3e2d6;
  text-align: left;
  background: var(--cream);
  border: 1px solid var(--line);
  border-top: 4px solid var(--accent);
  border-radius: 22px;
  padding: 24px 22px 20px;
  min-height: 274px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
  box-shadow: 0 2px 0 rgba(60, 45, 30, 0.02);
}

.test-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow);
  border-color: var(--accent);
}

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.card-index {
  font-family: var(--serif);
  font-size: 30px;
  color: var(--accent);
  line-height: 1;
}

.card-arrow {
  font-size: 18px;
  color: var(--muted);
  transition: transform 0.28s ease;
}

.test-card:hover .card-arrow {
  transform: translate(3px, -3px);
  color: var(--accent);
}

.test-card h3 {
  margin: 28px 0 6px;
  font-family: var(--serif);
  font-size: 27px;
  letter-spacing: 0.02em;
}

.card-question {
  margin: 0;
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink);
}

.card-short {
  margin: 10px 0 0;
  font-size: 12px;
  line-height: 1.7;
  color: var(--muted);
}

.card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 22px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--muted);
}

.card-meta span {
  color: var(--accent);
  font-weight: 600;
}

.demo-row {
  margin: 0 0 8px;
  text-align: center;
  font-size: 11px;
  color: var(--muted);
}

.demo-row button {
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  padding: 2px 3px;
  font-size: 11px;
  color: var(--ink);
  transition: color 0.2s ease, border-color 0.2s ease;
}

.demo-row button:hover {
  color: var(--accent);
  border-color: var(--accent);
}

.manifesto {
  border-top: 1px solid var(--line);
  margin-top: 30px;
  padding: 34px 0 40px;
}

.manifesto p {
  margin: 0;
  max-width: 620px;
  font-family: var(--serif);
  font-size: 20px;
  line-height: 1.8;
}

.home-footer {
  margin-top: auto;
  border-top: 1px solid var(--line);
  padding: 18px 0 26px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  font-size: 11px;
  color: var(--muted);
  line-height: 1.7;
}

/* ---------- test ---------- */

.test-shell,
.result-shell {
  --accent: #b85c38;
  --soft: #f3e2d6;
  width: min(100% - 40px, 560px);
  margin: 0 auto;
  min-height: 100vh;
}

.test-top,
.result-top {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 20px 0;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: rgba(255, 253, 248, 0.7);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  transition: border-color 0.2s ease, background 0.2s ease;
  flex: 0 0 auto;
}

.icon-btn:hover {
  border-color: var(--accent);
  background: var(--cream);
}

.progress {
  flex: 1;
  height: 3px;
  background: rgba(30, 28, 24, 0.1);
  border-radius: 99px;
  overflow: hidden;
}

.progress span {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.35s ease;
}

.count {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--muted);
  min-width: 36px;
  text-align: right;
}

.question {
  padding: 34px 0 80px;
}

.kicker {
  margin: 0 0 14px;
  font-size: 10px;
  letter-spacing: 0.24em;
  color: var(--accent);
  text-transform: uppercase;
}

.test-intro {
  margin: -4px 0 18px;
  font-size: 12px;
  line-height: 1.8;
  color: var(--muted);
}

.question h1 {
  margin: 0 0 34px;
  font-family: var(--serif);
  font-size: clamp(28px, 6vw, 36px);
  line-height: 1.45;
  font-weight: 700;
}

.options {
  display: grid;
  gap: 10px;
}

.option {
  width: 100%;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  text-align: left;
  background: rgba(255, 253, 248, 0.82);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 17px 18px;
  font-size: 15px;
  line-height: 1.6;
  transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}

.option:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  background: var(--cream);
}

.letter {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--soft);
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  margin-top: 1px;
}

/* ---------- result ---------- */

.result-top-label {
  flex: 1;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--muted);
}

.result-hero {
  text-align: center;
  padding: 34px 0 26px;
}

.result-hero h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(48px, 11vw, 68px);
  line-height: 1.1;
  letter-spacing: 0.02em;
}

.en {
  margin: 12px 0 0;
  font-size: 9px;
  letter-spacing: 0.28em;
  color: var(--muted);
}

.tagline {
  margin: 22px auto 0;
  max-width: 420px;
  font-family: var(--serif);
  font-size: 21px;
  line-height: 1.65;
  color: var(--accent);
}

.desc {
  margin: 18px auto 0;
  max-width: 440px;
  font-size: 14px;
  line-height: 1.95;
  color: #4d463c;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 22px;
}

.chips span {
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 99px;
  font-size: 11px;
  color: var(--muted);
  background: rgba(255, 253, 248, 0.7);
}

.chips .index-chip {
  border-color: var(--accent);
  background: var(--soft);
  color: var(--accent);
  font-weight: 600;
}

.share-card {
  position: relative;
  aspect-ratio: 3 / 4;
  border-radius: 26px;
  overflow: hidden;
  padding: 30px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: #fff8ec;
  background: var(--accent);
  box-shadow: var(--shadow);
  margin: 12px 0 16px;
}

.share-card::before {
  content: "";
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  border: 1px solid rgba(255, 248, 236, 0.28);
  right: -110px;
  top: -90px;
}

.share-card::after {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: rgba(255, 248, 236, 0.08);
  left: -70px;
  bottom: -60px;
}

.share-brand,
.share-main,
.share-chips,
.share-quote,
.share-footer {
  position: relative;
  z-index: 1;
}

.share-brand {
  font-size: 10px;
  letter-spacing: 0.24em;
  opacity: 0.8;
}

.share-label {
  margin: 0 0 6px;
  font-size: 10px;
  letter-spacing: 0.2em;
  opacity: 0.75;
}

.share-main h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(44px, 10vw, 58px);
  line-height: 1.12;
}

.share-tagline {
  margin: 14px 0 0;
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.6;
  opacity: 0.95;
}

.share-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.share-chips span {
  border: 1px solid rgba(255, 248, 236, 0.45);
  border-radius: 99px;
  padding: 5px 10px;
  font-size: 10px;
}

.share-quote {
  margin: 0;
  font-family: var(--serif);
  font-size: 15px;
  line-height: 1.7;
  opacity: 0.95;
}

.share-footer {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
  border-top: 1px solid rgba(255, 248, 236, 0.28);
  padding-top: 14px;
  font-size: 9px;
  letter-spacing: 0.08em;
  opacity: 0.75;
}

.share-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 34px;
}

.btn {
  border: 1px solid transparent;
  border-radius: 99px;
  padding: 14px 18px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn-primary {
  background: var(--ink);
  color: #fff8ec;
}

.btn-primary:hover {
  opacity: 0.9;
}

.btn-ghost {
  background: transparent;
  border-color: var(--line);
  color: var(--ink);
}

.btn-ghost:hover {
  border-color: var(--accent);
}

.section {
  border-top: 1px solid var(--line);
  padding: 24px 0 4px;
}

.section h3 {
  margin: 0 0 14px;
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--muted);
  text-transform: uppercase;
}

.section ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.section li {
  position: relative;
  padding-left: 18px;
  font-size: 14px;
  line-height: 1.8;
  color: #3f3931;
}

.section li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.7em;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}

.paid {
  margin-top: 28px;
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 22px;
  background: rgba(255, 253, 248, 0.65);
  position: relative;
  overflow: hidden;
}

.paid-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.paid-head h3 {
  margin: 0;
  font-size: 13px;
  letter-spacing: 0.14em;
}

.lock {
  font-size: 14px;
}

.paid-price {
  margin-left: auto;
  font-family: var(--serif);
  font-size: 20px;
  color: var(--accent);
}

.paid-preview {
  position: relative;
}

.paid-preview h4 {
  margin: 0 0 10px;
  font-size: 12px;
  letter-spacing: 0.08em;
}

.blurred {
  filter: blur(5px);
  opacity: 0.65;
  user-select: none;
  pointer-events: none;
}

.paid-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
  background: linear-gradient(180deg, rgba(255, 253, 248, 0.1), rgba(255, 253, 248, 0.94) 46%);
  padding: 20px;
}

.paid-overlay p {
  margin: 0;
  max-width: 300px;
  font-size: 11px;
  line-height: 1.8;
  color: var(--muted);
}

.paid-overlay .btn {
  min-width: 210px;
}

.paid-unlocked-note {
  margin: 0 0 18px;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--accent);
}

.quote-block {
  margin: 32px 0 0;
  padding: 24px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  text-align: center;
}

.quote-block p {
  margin: 0;
  font-family: var(--serif);
  font-size: 20px;
  line-height: 1.7;
}

.bottom-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 26px 0 60px;
}

/* ---------- talent v2 landing ---------- */

.talent-landing {
  --accent: #b85c38;
  --soft: #f3e2d6;
  min-height: 100vh;
}

.talent-hero {
  padding: 56px 0 38px;
}

.talent-hero h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(44px, 8vw, 72px);
  line-height: 1.12;
  letter-spacing: -0.02em;
}

.talent-hero h1 em {
  font-style: normal;
  color: var(--accent);
}

.talent-sub {
  margin: 22px 0 0;
  font-size: 13px;
  letter-spacing: 0.06em;
  color: var(--accent);
}

.talent-desc {
  margin: 18px 0 0;
  max-width: 560px;
  font-size: 14px;
  line-height: 1.95;
  color: var(--muted);
}

.format-row {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 18px;
}

.format-row span {
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: rgba(255, 253, 248, 0.62);
  font-size: 10px;
  color: var(--muted);
}

.talent-cta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 28px;
}

.talent-cta .btn {
  min-width: 170px;
}

.code-hint {
  margin: 14px 0 0;
  font-size: 11px;
  color: var(--muted);
}

.code-hint strong {
  color: var(--accent);
  letter-spacing: 0.08em;
}

.landing-section {
  border-top: 1px solid var(--line);
  padding: 30px 0 8px;
}

.landing-section h3 {
  margin: 0 0 16px;
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--muted);
  text-transform: uppercase;
}

.dim-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
}

.dim-chip {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255, 253, 248, 0.68);
}

.dim-key {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--soft);
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
}

.dim-chip strong {
  display: block;
  font-family: var(--serif);
  font-size: 14px;
  font-weight: 700;
}

.dim-chip small {
  display: block;
  margin-top: 2px;
  font-size: 10px;
  line-height: 1.5;
  color: var(--muted);
}

.sample-role-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.sample-role {
  padding: 18px 16px;
  border: 1px solid var(--line);
  border-top: 3px solid var(--accent);
  border-radius: 16px;
  background: rgba(255, 253, 248, 0.68);
}

.sample-role-name {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 700;
}

.sample-role p {
  margin: 8px 0 0;
  font-size: 11px;
  line-height: 1.7;
  color: var(--muted);
}

.landing-note {
  margin: 28px 0 50px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  font-size: 10px;
  line-height: 1.8;
  color: var(--muted);
}

.landing-note p {
  margin: 0 0 6px;
}

/* ---------- code modal ---------- */

.code-modal {
  text-align: center;
}

.code-input {
  width: 100%;
  margin: 6px 0 4px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-align: center;
  outline: none;
  text-transform: uppercase;
}

.code-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--soft);
}

.code-error {
  min-height: 18px;
  margin: 4px 0 10px;
  font-size: 11px;
  color: #b23a2e;
}

/* ---------- dimension result ---------- */

.swatch {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  flex: 0 0 auto;
  margin-top: 1px;
  border: 1px solid rgba(30, 28, 24, 0.12);
}

.overall-index {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(255, 253, 248, 0.68);
  margin: 4px 0 18px;
}

.overall-number {
  flex: 0 0 auto;
  min-width: 118px;
}

.overall-number span {
  display: block;
  font-size: 9px;
  letter-spacing: 0.16em;
  color: var(--muted);
  margin-bottom: 4px;
}

.overall-number strong {
  font-family: var(--serif);
  font-size: 42px;
  line-height: 1;
  color: var(--accent);
}

.overall-number small {
  font-size: 9px;
  color: var(--muted);
  margin-left: 4px;
}

.overall-index p {
  flex: 1;
  margin: 0;
  font-size: 10px;
  line-height: 1.7;
  color: var(--muted);
}

.top-dims {
  display: grid;
  gap: 12px;
}

.top-dim {
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: rgba(255, 253, 248, 0.68);
}

.top-dim-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.rank {
  font-family: var(--serif);
  font-size: 12px;
  color: var(--accent);
  letter-spacing: 0.08em;
}

.top-dim-name {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 700;
}

.top-dim-score {
  margin-left: auto;
  font-size: 11px;
  color: var(--muted);
}

.top-dim p {
  margin: 8px 0 0;
  font-size: 11px;
  line-height: 1.6;
  color: var(--muted);
}

.bar {
  height: 6px;
  margin-top: 8px;
  border-radius: 99px;
  background: rgba(30, 28, 24, 0.08);
  overflow: hidden;
}

.bar > span {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: var(--accent);
  transition: width 0.5s ease;
}

.radar-wrap {
  margin: 24px 0 8px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(255, 253, 248, 0.62);
}

.radar-svg {
  display: block;
  width: 100%;
  max-width: 360px;
  margin: 0 auto;
  height: auto;
}

.report-lead {
  margin: 0 0 24px;
  padding: 16px 18px;
  border-radius: 14px;
  background: var(--soft);
  font-size: 13px;
  line-height: 1.85;
  color: #3f3931;
}

.report-lead strong {
  color: var(--accent);
}

.report-dims {
  display: grid;
  gap: 0;
}

.dim-section {
  border-top: 1px solid var(--line);
  padding: 22px 0 6px;
}

.dim-section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}

.dim-section-head h4 {
  margin: 0;
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 700;
}

.dim-section-head span {
  font-size: 11px;
  color: var(--muted);
}

.dim-text {
  margin: 12px 0 14px;
  font-size: 13px;
  line-height: 1.9;
  color: #3f3931;
}

.dim-section h5 {
  margin: 14px 0 6px;
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--muted);
  text-transform: uppercase;
}

.dim-section ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 5px;
}

.dim-section li {
  position: relative;
  padding-left: 14px;
  font-size: 12px;
  line-height: 1.7;
  color: #4d463c;
}

.dim-section li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.65em;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
}

.paid-preview .dim-section {
  border-top: 0;
  padding-top: 0;
}

.paid-preview .dim-section h5,
.paid-preview .dim-section ul {
  display: none;
}

/* ---------- question types ---------- */

.q-hint {
  margin: -4px 0 18px;
  font-size: 12px;
  line-height: 1.7;
  color: var(--muted);
}

.q-visual {
  margin: 0 0 18px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(255, 253, 248, 0.72);
}

.cube-net {
  display: block;
  width: 100%;
  max-width: 320px;
  margin: 0 auto;
  height: auto;
}

.parking-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  max-width: 520px;
  margin: 0 auto;
}

.parking-cell {
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #FFFDF8;
  border: 1px solid #1E1C18;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(14px, 4vw, 24px);
  font-weight: 700;
}

.parking-empty {
  background: var(--soft);
  color: var(--accent);
  border-style: dashed;
}

.matrix-grid {
  display: grid;
  grid-template-columns: repeat(3, 74px);
  gap: 0;
  justify-content: center;
}

.matrix-cell {
  width: 74px;
  height: 74px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  background: #FFFDF8;
}

.matrix-cell:nth-child(3n + 1) {
  border-left: 0;
}

.matrix-cell:nth-child(3n) {
  border-right: 0;
}

.matrix-cell:nth-child(-n + 3) {
  border-top: 0;
}

.matrix-cell:nth-child(n + 7) {
  border-bottom: 0;
}

.matrix-missing {
  background: var(--soft);
  border-style: dashed;
  color: var(--accent);
  font-family: var(--serif);
  font-size: 24px;
}

.shape {
  line-height: 1;
  color: #1E1C18;
}

.shape-s {
  font-size: 18px;
}

.shape-m {
  font-size: 28px;
}

.shape-l {
  font-size: 40px;
}

.track-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  max-width: 420px;
  margin: 0 auto;
}

.track-card {
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #FFFDF8;
  text-align: center;
}

.track-svg {
  display: block;
  width: 100%;
  height: auto;
}

.track-card span {
  display: block;
  margin-top: 4px;
  font-size: 10px;
  color: var(--muted);
}

.rank-list {
  display: grid;
  gap: 10px;
}

.rank-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  padding: 17px 18px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(255, 253, 248, 0.82);
  transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
}

.rank-item:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}

.rank-item.selected {
  border-color: var(--accent);
  background: var(--soft);
}

.rank-badge {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(30, 28, 24, 0.06);
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
}

.rank-item.selected .rank-badge {
  background: var(--accent);
  color: #fff8ec;
}

.rank-copy {
  flex: 1;
  font-size: 15px;
  line-height: 1.55;
}

.rank-check {
  color: var(--accent);
  font-size: 14px;
  font-weight: 700;
}

.color-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.color-option {
  text-align: left;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(255, 253, 248, 0.82);
  transition: border-color 0.2s ease, transform 0.2s ease;
}

.color-option:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
}

.color-swatch {
  display: block;
  height: 92px;
  border-radius: 12px;
  margin-bottom: 10px;
}

.color-copy {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 11px;
  line-height: 1.55;
  color: #3f3931;
}

.color-copy strong {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--soft);
  color: var(--accent);
  font-size: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  margin-top: 1px;
}

.audio-list {
  display: grid;
  gap: 10px;
}

.audio-option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(255, 253, 248, 0.82);
  cursor: pointer;
}

.audio-option:hover {
  border-color: var(--accent);
}

.audio-play {
  width: auto;
  min-width: 64px;
  height: 36px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--accent);
  background: var(--soft);
  color: var(--accent);
  font-size: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  white-space: nowrap;
}

.audio-play:hover {
  background: var(--accent);
  color: #fff8ec;
}

.audio-copy {
  flex: 1;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  line-height: 1.55;
}

.audio-copy strong {
  color: var(--accent);
  font-size: 10px;
  letter-spacing: 0.08em;
  margin-top: 3px;
}

.audio-select {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 99px;
  padding: 8px 12px;
  font-size: 11px;
  color: var(--ink);
  flex: 0 0 auto;
}

.audio-select:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.ability-options .option {
  border-left: 3px solid var(--accent);
}

.ability-options .option:hover {
  background: var(--soft);
}

.solution-options .option {
  border-left: 3px solid var(--soft);
}

.solution-options .option:hover {
  border-left-color: var(--accent);
}

/* ---------- quantitative report ---------- */

.top-dim-level {
  font-size: 10px;
  font-weight: 700;
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 99px;
  padding: 2px 7px;
}

.dim-section-head {
  align-items: flex-start;
}

.dim-title {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.dim-title span {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.02em;
}

.dim-index {
  text-align: right;
  line-height: 1;
  flex: 0 0 auto;
}

.dim-index strong {
  display: block;
  font-family: var(--serif);
  font-size: 34px;
  font-weight: 700;
  color: var(--accent);
}

.dim-index small {
  display: block;
  margin-top: 4px;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.04em;
}

.report-text {
  margin: 0;
  font-size: 13px;
  line-height: 1.9;
  color: #3f3931;
}

.combo-notes {
  margin-top: 14px;
  padding: 12px 14px;
  border-left: 2px solid var(--accent);
  background: rgba(255, 253, 248, 0.62);
}

.combo-notes p {
  margin: 0 0 7px;
  font-size: 12px;
  line-height: 1.8;
  color: #4d463c;
}

.combo-notes p:last-child {
  margin-bottom: 0;
}

.combo-notes strong {
  color: var(--accent);
}

.career-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.career-list li {
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 253, 248, 0.62);
}

.career-list strong {
  display: block;
  font-family: var(--serif);
  font-size: 14px;
  font-weight: 700;
}

.career-list span {
  display: block;
  margin-top: 4px;
  font-size: 11px;
  line-height: 1.6;
  color: var(--muted);
}

.career-warning {
  display: block;
  margin-top: 7px;
  padding: 6px 8px;
  border-left: 2px solid #C08A5E;
  border-radius: 0 8px 8px 0;
  background: rgba(184, 92, 56, 0.06);
  font-style: normal;
  font-size: 10px;
  line-height: 1.65;
  color: #7A5A42;
}

.career-warning-box {
  margin-top: 14px;
  padding: 12px 14px;
  border: 1px dashed var(--line);
  border-radius: 12px;
  background: rgba(255, 253, 248, 0.62);
}

.career-warning-box strong {
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--accent);
}

.career-warning-box ul {
  margin: 8px 0 0;
  padding-left: 16px;
}

.career-warning-box li {
  font-size: 11px;
  line-height: 1.7;
  color: var(--muted);
}

.action-plan-section .action-plan-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.action-plan-section .action-plan-head h3 {
  margin: 0;
}

.btn-small {
  padding: 8px 12px;
  font-size: 11px;
  white-space: nowrap;
}

.action-plan {
  display: grid;
  gap: 14px;
  margin-top: 4px;
}

.plan-week {
  padding-left: 14px;
  border-left: 2px solid var(--soft);
}

.plan-week-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.plan-week-head span {
  font-family: var(--serif);
  font-size: 11px;
  color: var(--accent);
}

.plan-week-head h4 {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
}

.plan-week ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 5px;
}

.plan-week li {
  position: relative;
  padding-left: 13px;
  font-size: 12px;
  line-height: 1.7;
  color: #4d463c;
}

.plan-week li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.65em;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
}

/* ---------- modal ---------- */

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(30, 28, 24, 0.45);
  backdrop-filter: blur(6px);
}

.modal {
  width: min(100%, 380px);
  background: var(--cream);
  border-radius: 24px;
  padding: 28px 24px 22px;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.24);
  animation: fadeUp 0.3s ease both;
}

.modal-mark {
  font-family: var(--serif);
  font-size: 34px;
  color: var(--accent);
  margin-bottom: 4px;
}

.modal h3 {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 23px;
}

.modal p {
  margin: 0 0 18px;
  font-size: 12px;
  line-height: 1.8;
  color: var(--muted);
}

.modal .btn {
  width: 100%;
  margin-bottom: 8px;
}

.modal-note {
  margin: 4px 0 0 !important;
  font-size: 10px !important;
  opacity: 0.7;
}

/* ---------- toast ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: 34px;
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff8ec;
  font-size: 12px;
  padding: 11px 18px;
  border-radius: 99px;
  z-index: 80;
  animation: toastIn 0.25s ease both;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
}

@keyframes toastIn {
  from { opacity: 0; transform: translate(-50%, 8px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-up {
  animation: fadeUp 0.4s ease both;
}

/* ---------- responsive ---------- */

@media (max-width: 820px) {
  .test-grid {
    grid-template-columns: 1fr;
  }

  .test-card {
    min-height: 0;
  }

  .hero {
    padding: 54px 0 36px;
  }

  .hero h1 {
    font-size: clamp(38px, 11vw, 54px);
  }

  .brand-tag {
    display: none;
  }

  .home-footer {
    flex-direction: column;
    align-items: flex-start;
  }

  .share-card {
    padding: 24px;
  }

  .talent-hero {
    padding: 40px 0 30px;
  }

  .talent-hero h1 {
    font-size: clamp(38px, 11vw, 54px);
  }

  .dim-grid {
    grid-template-columns: 1fr;
  }

  .sample-role-grid {
    grid-template-columns: 1fr;
  }

  .talent-cta {
    flex-direction: column;
  }

  .talent-cta .btn {
    width: 100%;
  }
}

@media (max-width: 420px) {
  .wrap,
  .test-shell,
  .result-shell {
    width: min(100% - 28px, 560px);
  }

  .option {
    padding: 15px 14px;
    font-size: 14px;
  }

  .share-actions,
  .bottom-actions {
    grid-template-columns: 1fr;
  }

  .code-input {
    font-size: 18px;
    letter-spacing: 0.16em;
  }

  .radar-wrap {
    padding: 8px;
  }

  .color-swatch {
    height: 68px;
  }

  .dim-index strong {
    font-size: 28px;
  }

  .overall-index {
    align-items: flex-start;
    flex-direction: column;
    gap: 10px;
  }
}

@media (max-width: 360px) {
  .color-grid {
    grid-template-columns: 1fr;
  }

  .audio-option {
    flex-wrap: wrap;
  }

  .audio-select {
    margin-left: 52px;
  }
}

/* ---------- talent-final additions ---------- */

.landing-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 18px 0;
  margin: 10px 0 6px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.landing-stats div {
  text-align: center;
}

.landing-stats strong {
  display: block;
  font-family: var(--serif);
  font-size: 34px;
  line-height: 1;
  color: var(--accent);
}

.landing-stats span {
  display: block;
  margin-top: 6px;
  font-size: 9px;
  letter-spacing: 0.08em;

}

.evidence-grid {

}

.evidence-card {

.evidence-card > span {

  letter-spacing: 0.12em;

  font-size: 16px;

  font-size: 11px;

.sample-challenge {

.sample-challenge-q {

  font-family: var(--serif);

.sample-challenge .q-visual {

.sample-challenge-note {

.report-preview {

.preview-left h3 {

.preview-left p {
  margin: 0;
  font-size: 12px;
  line-height: 1.8;

}

.preview-chips {
  display: flex;

.preview-chips span {

.preview-famous {

.preview-bar {

.preview-bar > span {

.preview-bar b {

}

.preview-bar .bar {

.preview-note {

.famous-section {

.famous-head {

.famous-head h3 {

  function shuffleOrder(n, seed) {
    var arr = [];
    for (var i = 0; i < n; i++) arr.push(i);
    var s = seed + 1;
    for (var j = n - 1; j > 0; j--) {
      s = (s * 9301 + 49297) % 233280;
      var k = Math.floor(s / 233280 * (j + 1));
      var tmp = arr[j]; arr[j] = arr[k]; arr[k] = tmp;

  function supabaseRpc(name, payload) {
    var cfg = supabaseConfig();

    return fetch(cfg.url.replace(/\/$/, '') + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: {
        'apikey': cfg.anonKey,
        'Authorization': 'Bearer ' + cfg.anonKey,

        '<header class="test-top">' +
          '<button class="icon-btn" data-action="back" aria-label="返回">←</button>' +
          '<div class="progress"><span style="width:' + pct + '%"></span></div>' +
          '<span class="count">' + (state.index + 1) + ' / ' + T.questions.length + '</span>' +
        '</header>' +
        '<main class="question fade-up">' +
          '<p class="kicker">' + T.index + ' · 天赋测评 · ' + layerLabel(q) + '</p>' +
          '<h1>' + esc(q.q).replace(/\n/g, '<br>') + '</h1>' +
          body +
        '</main>' +
      '</div>';

    window.scrollTo(0, 0);
  }

  function answer(score) {
    if (state.locked) return;
    state.locked = true;
    var q = T.questions[state.index];
    var payload = { dim: q.dim, layer: q.layer, s: score };
    state.answers.push(payload);
    applyAnswer(payload);
    advance();
  }

  function answerTradeoff(dim) {
    if (state.locked) return;
    state.locked = true;
    var payload = { tradeoff: dim };
    state.answers.push(payload);
    applyAnswer(payload);
    advance();
  }

  function advance() {
    if (state.index < T.questions.length - 1) {
      state.index += 1;
      renderQuestion();
    } else {
      computeResult();
      renderResult();
    }
  }

  var audioEl = null;

  function playSound(key) {
    var src = (window.DUILU_SOUNDS || {})[key];
    if (!src) { toast('这段声音暂时不可用'); return; }
    try {
      if (!audioEl) {
        audioEl = new Audio();
        audioEl.preload = 'auto';
      }
      audioEl.pause();
      audioEl.src = src;
      audioEl.currentTime = 0;
      audioEl.volume = 0.85;
      audioEl.load();
      var p = audioEl.play();
      if (p && p.catch) {
        p.catch(function () { toast('请再点一次播放'); });
      }
    } catch (e) {
      toast('当前浏览器无法播放声音');
    }
  }

  function computeResult() {
    state.totals = {};
    state.indexes = {};
    dims.forEach(function (d) {
      var l = state.layers[d.key];
      var total = l.ability + l.situation + l.self + l.tradeoff;
      var max = maxFor(d.key).total;
      state.totals[d.key] = total;
      state.indexes[d.key] = Math.min(100, Math.round(total / max * 100));
    });
    state.top3 = Object.keys(state.indexes).sort(function (a, b) {
      return state.indexes[b] - state.indexes[a] || state.totals[b] - state.totals[a];
    }).slice(0, 3);
    state.type = buildType(state.top3);
  }

  function findSpecial(top3) {
    var key = top3.slice().sort().join('');
    var names = Object.keys(T.compositeTypes);
    for (var i = 0; i < names.length; i++) {
      var c = T.compositeTypes[names[i]];
      if (c.sig.slice().sort().join('') === key) return c;
    }
    return null;
  }

  function pickFamous(keys) {
    var out = [];
    var seen = {};
    keys.forEach(function (k) {
      var pool = T.famousByDimension[k] || [];
      for (var i = 0; i < pool.length; i++) {
        if (!seen[pool[i].name]) {
          out.push(pool[i]);
          seen[pool[i].name] = true;
          break;
        }
      }
    });
    if (out.length < 3) {
      dims.forEach(function (d) {
        var pool = T.famousByDimension[d.key] || [];
        pool.forEach(function (p) {
          if (out.length < 3 && !seen[p.name]) {
            out.push(p);
            seen[p.name] = true;
          }
        });
      });
    }
    return out.slice(0, 3);
  }

  function buildType(top3) {
    var special = findSpecial(top3);
    if (special) {
      var copy = {};
      Object.keys(special).forEach(function (k) { copy[k] = special[k]; });
      copy.famous = T.specialFamous[copy.name] || pickFamous(copy.sig);
      return copy;
    }

    var keys = top3.slice().sort();
    var primary = keys[0], secondary = keys[1], tertiary = keys[2];
    var roleWords = { A: '叙事者', B: '策略家', C: '构建者', D: '观察者', E: '连接者', F: '行动者', G: '节奏者', H: '探索者', I: '发明者', J: '审美者' };
    var methodWords = { A: '叙事', B: '结构', C: '空间', D: '深度', E: '共情', F: '实践', G: '节奏', H: '生态', I: '灵感', J: '审美' };
    var styleWords = { A: '表达', B: '策略', C: '构图', D: '洞察', E: '协作', F: '手感', G: '听觉', H: '自然', I: '实验', J: '品味' };
    var roleMap = { A: '表达者', B: '破局者', C: '审美者', D: '陪伴者', E: '连接者', F: '打磨者', G: '表演者', H: '探索者', I: '破局者', J: '审美者' };
    var name = styleWords[tertiary] + methodWords[secondary] + roleWords[primary];
    var pd = dimMap[keys[0]], sd = dimMap[keys[1]], td = dimMap[keys[2]];
    return {
      sig: keys,
      name: name,
      en: 'YOUR TALENT MIX',
      tagline: '你的天赋不是单点，而是一种组合。',
      desc: '你的前三个维度是 ' + pd.full + '、' + sd.full + '、' + td.full + '。这让你在处理问题时，会同时调用三种不同的能力。',
      baseRole: roleMap[keys[0]] || '表达者',
      comboStrength: '你用「' + pd.name + '」做核心，用「' + sd.name + '」做方法，用「' + td.name + '」做风格。',
      comboRisk: '组合越复杂，越容易在不同模式之间切换；给自己一个明确的“主战场”会更容易出结果。',
      quote: '你不是某一种人，你是一种组合。',
      keywords: [pd.name, sd.name, td.name],
      famous: pickFamous(keys)
    };
  }

  function levelCode(i) {
    if (i >= 85) return 'S';
    if (i >= 70) return 'A';
    if (i >= 55) return 'B';
    if (i >= 40) return 'C';
    return 'D';
  }

  function levelLabel(i) {
    if (i >= 85) return '极强';
    if (i >= 70) return '强';
    if (i >= 55) return '中上';
    if (i >= 40) return '中';
    return '待唤醒';
  }

  function bandFor(i) {
    return i >= 70 ? 'high' : i >= 40 ? 'mid' : 'low';
  }

  function diagnose(dim) {
    var l = state.layers[dim];
    var a = l.ability, s = l.situation, se = l.self;
    if (a >= 2.4 && se <= 1.5) return '潜力未开发';
    if (se >= 2.4 && a <= 1.5) return '兴趣错位 / 自信偏差';
    if (s >= 2.4 && a <= 1.5) return '经验型';
    if (a >= 2.4 && s <= 1.5) return '有天赋但不想用';
    if (a >= 2.4 && se >= 2.4) return '稳定优势';
    return '待唤醒 / 综合型';
  }

  function sectionHTML(title, items) {
    return '<div class="sub-section"><h4>' + esc(title) + '</h4><ul>' + items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
  }

  function renderTopDims() {
    return state.top3.map(function (key, i) {
      var d = dimMap[key];
      var idx = state.indexes[key];
      return '<div class="top-dim">' +
        '<div class="top-dim-head"><span class="rank">0' + (i + 1) + '</span><span class="top-dim-name">' + esc(d.full) + '</span><span class="top-dim-level">' + levelCode(idx) + '</span><span class="top-dim-score">' + idx + ' / 100</span></div>' +
        '<div class="bar"><span style="width:' + idx + '%"></span></div>' +
        '<p>' + esc(d.short) + ' · 原始得分 ' + state.totals[key] + ' / ' + maxFor(key).total + '</p>' +
      '</div>';
    }).join('');
  }

  function renderRadar() {
    var el = document.getElementById('radar');
    if (!el) return;
    var n = dims.length, cx = 160, cy = 160, R = 104;
    function point(i, radius) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n;
      return [cx + Math.cos(a) * radius, cy + Math.sin(a) * radius];
    }
    var grid = [0.25, 0.5, 0.75, 1].map(function (lv) {
      return '<polygon points="' + dims.map(function (_, i) { return point(i, R * lv).map(function (x) { return x.toFixed(1); }).join(','); }).join(' ') + '" fill="none" stroke="#DED4C3"/>';
    }).join('');
    var axes = dims.map(function (_, i) {
      var p = point(i, R);
      return '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="#E8DFD0"/>';
    }).join('');
    var poly = dims.map(function (d, i) {
      var v = Math.max(0.06, state.indexes[d.key] / 100);
      return point(i, R * v).map(function (x) { return x.toFixed(1); }).join(',');
    }).join(' ');
    var dots = dims.map(function (d, i) {
      var v = Math.max(0.06, state.indexes[d.key] / 100);
      var p = point(i, R * v);
      return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="' + T.accent + '"/>';
    }).join('');
    var labels = dims.map(function (d, i) {
      var p = point(i, R + 25);
      var anchor = Math.abs(p[0] - cx) < 8 ? 'middle' : (p[0] > cx ? 'start' : 'end');
      return '<text x="' + p[0].toFixed(1) + '" y="' + p[1].toFixed(1) + '" text-anchor="' + anchor + '" dominant-baseline="middle" font-size="10" fill="#7C7365">' + esc(d.name) + '</text>';
    }).join('');
    el.innerHTML = '<svg viewBox="0 0 320 320" class="radar-svg" role="img" aria-label="天赋雷达图">' + grid + axes +
      '<polygon points="' + poly + '" fill="' + T.accent + '2E" stroke="' + T.accent + '" stroke-width="2"/>' + dots + labels + '</svg>';
  }

  function renderDimensionModule(d) {
    var idx = state.indexes[d.key];
    var total = state.totals[d.key];
    var l = state.layers[d.key];
    var profile = T.dimensionProfiles[d.key][bandFor(idx)];
    var rank = dims.map(function (x) { return x.key; }).sort(function (a, b) { return state.indexes[b] - state.indexes[a]; }).indexOf(d.key) + 1;
    var maxTradeoff = maxFor(d.key).tradeoff;

    function layerRow(label, value, max) {
      return '<div class="layer-row"><span class="layer-label">' + label + '</span><div class="bar"><span style="width:' + (value / max * 100) + '%"></span></div><b class="layer-value">' + value + '/' + max + '</b></div>';
    }

    return '<section class="dim-section">' +
      '<div class="dim-section-head">' +
        '<div class="dim-title"><h4>' + esc(d.full) + '</h4><span>第 ' + rank + ' / 10 · ' + levelLabel(idx) + ' · ' + total + ' / ' + maxFor(d.key).total + '</span></div>' +
        '<div class="dim-index"><strong>' + idx + '</strong><small>/ 100 · ' + levelCode(idx) + '</small></div>' +
      '</div>' +
      '<div class="bar"><span style="width:' + idx + '%"></span></div>' +
      '<div class="layer-grid">' +
        layerRow('能力', l.ability, 3) +
        layerRow('情景', l.situation, 3) +
        layerRow('自评', l.self, 3) +
        layerRow('取舍', l.tradeoff, maxTradeoff) +
      '</div>' +
      '<p class="dim-text">' + esc(profile.text) + '</p>' +
      '<h5>你可能有的表现</h5><ul>' + profile.evidence.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
      '<h5>容易踩的坑</h5><ul>' + profile.blind.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
      '<h5>一个练习</h5><ul>' + profile.practice.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
    '</section>';
  }

  function renderGap() {
    var rows = state.top3.map(function (key) {
      var l = state.layers[key];
      return '<div class="gap-row"><span>' + esc(dimMap[key].name) + '</span><span>' + l.ability + '/3</span><span>' + l.situation + '/3</span><span>' + l.self + '/3</span><span>' + l.tradeoff + '/' + maxFor(key).tradeoff + '</span><span class="gap-tag">' + diagnose(key) + '</span></div>';
    }).join('');
    var top = state.top3[0];
    var l = state.layers[top];
    var gapText = '';
    if (l.ability >= 2.4 && l.self <= 1.5) gapText = '你的「' + dimMap[top].full + '」能力分明显高于自评分：这更像“没被开发的潜力”，不是“你不行”。';
    else if (l.self >= 2.4 && l.ability <= 1.5) gapText = '你的「' + dimMap[top].full + '」自评分高于能力分：你可能喜欢它，但方法还没对上，属于“兴趣错位/自信偏差”。';
    else if (l.situation >= 2.4 && l.ability <= 1.5) gapText = '你的「' + dimMap[top].full + '」情景分高于能力分：你可能是经验型，在真实场景里比做题更能发挥。';
    else if (l.ability >= 2.4 && l.situation <= 1.5) gapText = '你的「' + dimMap[top].full + '」能力分高于情景分：你有这个能力，但不一定想用；别把天赋浪费在不喜欢的事上。';
    else gapText = '你的「' + dimMap[top].full + '」四层证据比较一致，是可以稳定使用的优势。';

    return '<section class="report-block">' +
      '<div class="block-head"><span>04</span><h3>四层证据落差</h3></div>' +
      '<p class="report-lead">' + esc(gapText) + '</p>' +
      '<div class="gap-table"><div class="gap-row gap-head"><span>维度</span><span>能力</span><span>情景</span><span>自评</span><span>取舍</span><span>判断</span></div>' + rows + '</div>' +
    '</section>';
  }

  function buildPlan(role) {
    var weeks = [
      { label: '第 1 周 · 看见', tasks: ['记录 3 次你进入心流的场景，写下当时在做什么。', '用「' + role.strengths[0] + '」解释：为什么这件事让你有能量。'] },
      { label: '第 2 周 · 验证', tasks: [role.experiments[0], '找一个你信任的人，让他给你一个反馈：你最像哪种天赋？'] },
      { label: '第 3 周 · 放大', tasks: [role.advice[0], role.experiments[1]] },
      { label: '第 4 周 · 复盘', tasks: [role.watchouts[0], role.experiments[2], '写下：接下来 3 个月，你要多做什么、少做什么？'] }
    ];
    return weeks.map(function (w, i) {
      return '<div class="plan-week"><div class="plan-week-head"><span>0' + (i + 1) + '</span><h4>' + esc(w.label) + '</h4></div><ul>' + w.tasks.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
  }

  function renderResult() {
    var t = state.type;
    var base = T.roles[t.baseRole] || T.roles['表达者'];
    var top = state.top3[0];
    var overall = Math.round((state.indexes[state.top3[0]] + state.indexes[state.top3[1]] + state.indexes[state.top3[2]]) / 3);
    var keywords = t.keywords.map(function (k) { return '<span>' + esc(k) + '</span>'; }).join('') + '<span class="index-chip">综合指数 ' + overall + '</span>';
    var famous = (t.famous || []).map(function (f) {
      return '<div class="famous-card"><strong>' + esc(f.name) + '</strong><span>' + esc(f.note) + '</span></div>';
    }).join('');

      { label: '核心', key: t.sig[0] },

    ].map(function (x, i) {
      var d = dimMap[x.key];
      return '<div class="combo-step"><span>' + x.label + '</span><strong>' + esc(d.full) + '</strong><small>' + esc(d.short) + '</small></div>';
    }).join('');

    var dimensionModules = dims.slice().sort(function (a, b) { return state.indexes[b.key] - state.indexes[a.key]; }).map(renderDimensionModule).join('');

    app.innerHTML =
      '<div class="result-shell" style="--accent:' + T.accent + ';--soft:' + T.accentSoft + '">' +
        '<header class="result-top"><button class="icon-btn" data-action="home" aria-label="回到首页">←</button><span class="result-top-label">天赋测评</span><button class="icon-btn" data-action="restart" aria-label="重新测试">↻</button></header>' +
        '<main class="fade-up">' +
          '<section class="result-hero">' +
            '<p class="kicker">你的天赋类型</p>' +

            '<p class="en">' + esc(t.en || 'YOUR TALENT MIX') + '</p>' +

            '<p class="desc">' + esc(t.desc) + '</p>' +

            '<div class="block-head"><span>02</span><h3>你的组合逻辑</h3></div>' +

            '<div class="combo-notes"><p><strong>组合优势：</strong>' + esc(t.comboStrength) + '</p><p><strong>组合风险：</strong>' + esc(t.comboRisk) + '</p></div>' +

              var warning = (T.careerWarnings[base.name] && T.careerWarnings[base.name][i]) || '';
              return '<li><strong>' + esc(c) + '</strong><span>' + esc((base.careerNotes && base.careerNotes[i]) || '') + '</span>' +
                (warning ? '<em class="career-warning">避坑：' + esc(warning) + '</em>' : '') +
              '</li>';
            }).join('') + '</ul>' +
            '<div class="career-warning-box"><strong>共同的避坑提醒</strong><ul>' +
              base.watchouts.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') +

            '<div class="share-chips">' + t.keywords.map(function (k) { return '<span>' + esc(k) + '</span>'; }).join('') + '</div>' +
            '<p class="share-quote">“' + esc(t.quote) + '”</p>' +

          '</section>' +

  function togglePlan() {
    var el = document.getElementById('actionPlan');
    if (!el) return;
    if (el.hidden) {
      var base = T.roles[state.type.baseRole] || T.roles['表达者'];
      el.innerHTML = buildPlan(base);
      el.hidden = false;
      toast('30 天行动计划已生成');
    } else {
      el.hidden = true;
    }
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); resolve(); } catch (e) { reject(e); }
      ta.remove();
    });
  }

  function copyShare() {
    var t = state.type;
    copyText('我在「对路」测出了我的天赋类型：' + t.name + '。\n' + t.tagline + '\n你是哪一种？').then(function () { toast('分享文案已复制'); }).catch(function () { toast('复制失败'); });
  }

  function toast(msg) {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el);
    window.setTimeout(function () { el.remove(); }, 2200);
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    var chars = Array.from(text), line = '', yy = y;
    for (var i = 0; i < chars.length; i++) {
      var test = line + chars[i];
      if (ctx.measureText(test).width > maxWidth && line) {
        ctx.fillText(line, x, yy); line = chars[i]; yy += lineHeight;
      } else line = test;
    }
    if (line) ctx.fillText(line, x, yy);
    return yy;
  }

  function downloadCard() {
    var t = state.type;
    var W = 1080, H = 1440, pad = 86;
    var canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');
    var cream = '#FFF8EC';
    ctx.fillStyle = T.accent; ctx.fillRect(0, 0, W, H);
    var grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, 'rgba(255,255,255,0.10)'); grad.addColorStop(0.55, 'rgba(0,0,0,0.03)'); grad.addColorStop(1, 'rgba(0,0,0,0.28)');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,248,236,0.20)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(930, 180, 280, 0, Math.PI * 2); ctx.stroke();

    ctx.fillStyle = cream; ctx.globalAlpha = 0.78;
    ctx.font = '600 28px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText('对路 · 天赋测评', pad, 108);
    ctx.globalAlpha = 0.72; ctx.font = '500 26px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText('我的天赋类型', pad, 332); ctx.globalAlpha = 1;
    ctx.fillStyle = cream; ctx.font = '700 120px "Songti SC", "SimSun", serif';
    ctx.fillText(t.name, pad, 482);
    ctx.font = '400 44px "Songti SC", "SimSun", serif';
    wrapText(ctx, t.tagline, pad, 592, W - pad * 2, 66);

    var x = pad, y = 830;
    ctx.font = '500 28px "PingFang SC", "Microsoft YaHei", sans-serif';
    t.keywords.forEach(function (k) {
      var w = ctx.measureText(k).width + 44;
      if (x + w > W - pad) { x = pad; y += 64; }
      roundRect(ctx, x, y - 40, w, 54, 27);
      ctx.fillStyle = 'rgba(255,248,236,0.12)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,248,236,0.42)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = cream; ctx.fillText(k, x + 22, y - 6);
      x += w + 12;
    });

    ctx.globalAlpha = 0.95; ctx.font = '400 34px "Songti SC", "SimSun", serif';
    wrapText(ctx, '“' + t.quote + '”', pad, 1060, W - pad * 2, 52);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,248,236,0.28)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(pad, 1250); ctx.lineTo(W - pad, 1250); ctx.stroke();
    ctx.globalAlpha = 0.78; ctx.fillStyle = cream;
    ctx.font = '500 24px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText('你不是不行，只是没找对方向。', pad, 1310);
    ctx.textAlign = 'right'; ctx.font = '600 22px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText('DUILU', W - pad, 1310); ctx.textAlign = 'left'; ctx.globalAlpha = 1;

    var link = document.createElement('a');
    link.download = '对路-天赋测评-' + t.name + '.png';
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link); link.click(); link.remove();
    toast('结果卡已生成');
  }

  document.addEventListener('click', function (event) {
    var el = event.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    if (action === 'start') startTest();
    else if (action === 'login') renderLogin();
    else if (action === 'submit-code') submitCode();
    else if (action === 'home') renderLanding();
    else if (action === 'restart') startTest();
    else if (action === 'back') {
      if (state.index > 0) {
        state.index -= 1;
        state.answers.pop();
        rebuildLayers();
        renderQuestion();
      } else {
        renderLanding();
      }
    } else if (action === 'answer') {
      answer(parseInt(el.getAttribute('data-score'), 10));
    } else if (action === 'tradeoff') {
      answerTradeoff(el.getAttribute('data-dim'));
    } else if (action === 'audio-play') {
      playSound(el.getAttribute('data-sound'));
    } else if (action === 'plan') {
      togglePlan();
    } else if (action === 'copy') {
      copyShare();
    } else if (action === 'download') {
      downloadCard();
    }
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && event.target && event.target.id === 'codeInput') {
      event.preventDefault();
      submitCode();
    }
  });

  renderLanding();
  initAuth();

  if (window.__TALENT_TEST__) {
    window.__TALENT_DEBUG__ = {
      state: state,
      startTest: startTest,
      renderLanding: renderLanding,
      renderLogin: renderLogin,
      submitCode: submitCode,
      completeLogin: completeLogin,
      initAuth: initAuth,
      renderQuestion: renderQuestion,
      answer: answer,
      answerTradeoff: answerTradeoff,
      playSound: playSound,
      computeResult: computeResult,
      renderResult: renderResult,
      togglePlan: togglePlan
    };
  }
})();

</script>
